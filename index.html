<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Junhi" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121010" />
    <meta name="description" content="Junhi · a little cozy mood journal. Nhật ký cảm xúc dịu dàng và ấm áp cho tâm hồn bạn ✿" />
    <style>
      html {
        background-color: #121010;
        color: #F5F2EC;
      }
    </style>
    <script>
      (function () {
        try {
          var savedDark = localStorage.getItem('junhi_theme')
          var currentUserId = localStorage.getItem('junhi_current_user_id')
          if (currentUserId) {
            var userTheme = localStorage.getItem('junhi_user_theme_' + currentUserId)
            if (userTheme === 'light' || userTheme === 'dark') {
              savedDark = userTheme
            }
          }
          var themeMode = localStorage.getItem('junhi_theme_mode') || 'modern'
          // Thứ tự ưu tiên: theme tài khoản -> localStorage -> MẶC ĐỊNH DARK (không phụ thuộc prefers-color-scheme)
          var isDark = savedDark ? savedDark === 'dark' : true
          var metaTheme = document.querySelector('meta[name="theme-color"]')
          var root = document.documentElement

          if (isDark) {
            root.classList.add('dark')
            root.setAttribute('data-theme', 'dark')
            if (metaTheme) metaTheme.setAttribute('content', '#121010')
          } else {
            root.classList.remove('dark')
            root.setAttribute('data-theme', 'light')
            if (metaTheme) metaTheme.setAttribute('content', '#F3F1EC')
          }

          if (themeMode === 'win95') {
            root.classList.add('theme-win95')
          }

          var rawConfig = localStorage.getItem('junhi_custom_theme_config')
          if (rawConfig && themeMode === 'custom') {
            var cfg = JSON.parse(rawConfig)
            if (cfg && cfg.version === 1) {
              var colors = isDark ? cfg.dark : cfg.light
              if (colors) {
                root.style.setProperty('--bg', colors.bg)
                root.style.setProperty('--surface', colors.surface)
                root.style.setProperty('--surface-2', colors.surface2)
                root.style.setProperty('--text', colors.text)
                root.style.setProperty('--text-muted', colors.textMuted)
                root.style.setProperty('--border', colors.border)
                root.style.setProperty('--border-strong', colors.borderStrong)
                root.style.setProperty('--accent', colors.accent)
                root.style.setProperty('--accent-contrast', colors.accentContrast)
                if (metaTheme) metaTheme.setAttribute('content', colors.bg)
              }
              if (cfg.fontHeading) root.style.setProperty('--font-heading', cfg.fontHeading)
              if (cfg.fontBody) root.style.setProperty('--font-body', cfg.fontBody)
              if (cfg.fontSizeBase) root.style.setProperty('--font-size-base', cfg.fontSizeBase + 'px')
              if (cfg.lineHeight) root.style.setProperty('--line-height', String(cfg.lineHeight))
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
